name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the README states; 24 is what the Docker image runs.
        node: [22, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `cache: npm` keys off package-lock.json, so unchanged dependencies
      # restore instead of refetch.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ahead of the build, so a type error is reported as a type error rather
      # than as whatever the bundler makes of it downstream.
      - name: Typecheck
        run: npm run check

      # Includes the form-action smoke test, which boots the app in a Vite
      # dev server and posts every form through SvelteKit.
      - name: Tests
        run: npm run test

      # No env needed: every secret this app reads is read at request time,
      # not during the build.
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build only, never pushed: proves the Dockerfile's Node base image
      # still installs (better-sqlite3 compiles here) and builds the app.
      - name: Build image
        run: docker build --tag zajel-mail:ci .
