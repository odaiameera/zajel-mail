services:
  webmail:
    build: .
    container_name: webmail
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      # Public URL the app is served from — required for form posts
      # (SvelteKit CSRF protection) when running behind a reverse proxy.
      - ORIGIN=https://webmail.example.com
      # Behind the proxy every request arrives from the proxy itself, so
      # sign-in limits would count all clients as one. Read the client's
      # address from the header the proxy adds (nginx, Caddy and Traefik
      # all set X-Forwarded-For); depth 1 trusts only that one proxy.
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      # Default mail server new accounts link against (your Stalwart base URL).
      - JMAP_BASE_URL=https://mail.example.com
      - DATABASE_PATH=/data/ameera.db
      # Event log for a watcher on the host (a monitoring agent, tail -f):
      # one JSON object per line, no mail content. It lands in ./logs on
      # the host through the volume below.
      - LOG_FILE=/logs/zajel.log
      # REQUIRED. Encrypts linked mail-account passwords at rest. Generate
      # with: openssl rand -base64 32 — and back it up: rotating it means
      # re-entering every linked account's mail password.
      - WEBMAIL_SECRET=<openssl rand -base64 32>
      # AI mail assistant (Raven) and event extraction; leave unset to hide it.
      # Claude, when its key is set: the agent that acts on your mailbox runs
      # on Claude Opus 5.5, and summaries, drafts and extraction on Claude
      # Haiku 5.5. It takes over from the providers below unless AI_PROVIDER
      # says otherwise (anthropic, openai or ollama).
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - ANTHROPIC_MODEL=claude-opus-5-5
      # - ANTHROPIC_FAST_MODEL=claude-haiku-5-5
      # A turn that finds the agent's model overloaded or rate limited as it
      # starts runs on this one instead:
      # - ANTHROPIC_FALLBACK_MODEL=claude-sonnet-5-5
      # - AI_PROVIDER=anthropic
      # The agent's Telegram bot: create one with @BotFather and put its
      # token here, then link your chat in Settings → Notifications. It
      # sends urgent mail (judged by Jev) and reminders to that one chat.
      # - TELEGRAM_BOT_TOKEN=<token from @BotFather>
      # OpenAI, when its key is set (OPENAI_MODEL defaults to gpt-5.6-terra):
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_MODEL=gpt-5.6-luna
      # Otherwise Ollama Cloud or any self-hosted Ollama-compatible endpoint:
      # - OLLAMA_URL=https://ollama.com
      # - OLLAMA_API_KEY=<your ollama cloud api key>
      # - OLLAMA_MODEL=deepseek-v3.1:671b
      # Native task apps. Configure any combination; the confirmation card
      # lets the user choose a destination when more than one is connected.
      # - TODOIST_API_TOKEN=<todoist personal api token>
      # - TODOIST_PROJECT_ID=<optional todoist project id>
      # - LINEAR_API_KEY=<linear personal api key>
      # - LINEAR_TEAM_ID=<required linear team uuid>
      # - LINEAR_PROJECT_ID=<optional linear project uuid>
      # - NOTION_API_TOKEN=<notion integration token>
      # - NOTION_DATA_SOURCE_ID=<shared notion data source id>
      # - NOTION_DUE_PROPERTY=Due
      # Optional task API, automation webhook, or MCP-to-HTTP bridge. The AI
      # agent shows a proposal and requires confirmation before calling it.
      # - TASK_ADAPTER_URL=https://tasks.example.com/api/tasks
      # - TASK_ADAPTER_API_KEY=<task adapter bearer token>
    volumes:
      # Persistent SQLite store for per-user state (avatar, label/folder
      # metadata, signatures). Survives `docker compose up -d --build`.
      - webmail_data:/data
      - ./logs:/logs

volumes:
  webmail_data:
