<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Zajel Mail</title>
		<style>
			:root { color-scheme: dark; }
			html, body { height: 100%; margin: 0; }
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #09090b;
				color: #fafafa;
				font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				text-align: center;
				padding: 24px;
			}
			.card { max-width: 360px; }
			.mark { display: block; width: 56px; height: 56px; margin: 0 auto 20px; }
			h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
			p { font-size: 14px; line-height: 1.5; color: #a1a1aa; margin: 0 0 20px; }
			button {
				font: inherit; font-size: 14px; font-weight: 600;
				color: #fff; background: #6366f1; border: 0;
				padding: 10px 18px; border-radius: 10px; cursor: pointer;
			}
			button:hover { background: #818cf8; }
		</style>
	</head>
	<body>
		<div class="card">
			<img class="mark" src="/icon-192.png" alt="Zajel" />
			<h1>You're offline</h1>
			<p>Zajel Mail needs a connection to load your mail. Check your network and try again.</p>
			<button type="button" onclick="location.reload()">Retry</button>
		</div>
	</body>
</html>
