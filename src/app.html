<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- PWA: installable as a Chrome/Brave app + system mail handler -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Matches --color-surface (the app chrome), so the mobile browser bar
		     continues the shell rather than cutting a band across it. Kept in sync
		     with the theme by the bootstrap script below and by the appearance
		     setting; both write the light value when html.light is on. -->
		<meta name="theme-color" content="#010409" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Zajel Mail" />
		<script nonce="%sveltekit.nonce%">
			try{if(document.cookie.match(/theme=([^;]+)/)?.[1]==='light'){document.documentElement.classList.add('light');document.querySelector('meta[name=theme-color]')?.setAttribute('content','#f6f8fa')}}catch(e){}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
